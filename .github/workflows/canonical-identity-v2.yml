name: Canonical Identity v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/canonical-identity-v2.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Add canonical identity fields safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '        <section id="questionnaireSection" class="card hidden" tabindex="-1">'
          if marker not in s:
              raise SystemExit('QUESTIONNAIRE_MARKER_MISSING')

          before, protected = s.split(marker, 1)
          original_protected = protected

          name_old = '<input type="text" id="nomeCompleto" maxlength="80" placeholder="Ex.: Ana Souza">'
          name_new = '<input type="text" id="nomeCompleto" maxlength="80" placeholder="Ex.: Ana Souza" required>'
          if name_old in before:
              before = before.replace(name_old, name_new, 1)

          age_then_date = '''                <div class="field">\n                    <label for="idade">Idade</label>\n                    <input type="number" id="idade" min="10" max="100" placeholder="Ex.: 35">\n                </div>\n                <div class="field">\n                    <label for="dataAplicacao">Data</label>\n                    <input type="date" id="dataAplicacao">\n                </div>'''
          canonical = '''                <div class="field">\n                    <label for="idade">Idade</label>\n                    <input type="number" id="idade" min="10" max="100" placeholder="Ex.: 35">\n                </div>\n                <div class="field">\n                    <label for="dataNascimento">Data de nascimento</label>\n                    <input type="date" id="dataNascimento" required>\n                </div>\n                <div class="field">\n                    <label for="dataAplicacao">Data de aplicação do rastreio</label>\n                    <input type="date" id="dataAplicacao" required>\n                </div>'''
          if 'id="dataNascimento"' not in before:
              if age_then_date not in before:
                  raise SystemExit('IDENTITY_BLOCK_NOT_FOUND')
              before = before.replace(age_then_date, canonical, 1)

          old_helper = 'O nome completo é útil para\n                organizar a mensagem ao psicólogo e o relatório, mas não bloqueia o uso se for deixado em branco.'
          new_helper = 'Nome completo, data de nascimento e data de aplicação identificam corretamente o rastreio\n                para organização clínica e devem ser preenchidos antes de iniciar o questionário.'
          if old_helper in before:
              before = before.replace(old_helper, new_helper, 1)

          out = before + marker + protected
          if out.split(marker, 1)[1] != original_protected:
              raise SystemExit('QUESTIONNAIRE_RESULTS_OR_LOGIC_CHANGED')

          for token in ['id="nomeCompleto"', 'id="dataNascimento"', 'id="dataAplicacao"']:
              if token not in before:
                  raise SystemExit(f'MISSING_{token}')

          p.write_text(out, encoding='utf-8')
          PY

      - name: Validate canonical identity and protected questionnaire
        shell: bash
        run: |
          grep -q 'id="nomeCompleto"' index.html
          grep -q 'id="dataNascimento"' index.html
          grep -q 'id="dataAplicacao"' index.html
          grep -q 'Data de aplicação do rastreio' index.html
          grep -q 'id="questionnaireSection"' index.html
          grep -q 'id="resultsSection"' index.html

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Adiciona identificação canônica ao Mapa de Esquemas'
          git push
