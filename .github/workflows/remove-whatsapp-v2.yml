name: Remover WhatsApp de resultados v2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-whatsapp-v2.yml']
permissions:
  contents: write
jobs:
  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Remove WhatsApp channels without changing items or scoring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8'); before=s
          s=s.replace('Você pode enviar um resumo dos seus resultados diretamente para seu psicólogo via WhatsApp, compartilhar a página\n                ou baixar um relatório psicoeducativo em PDF para reflexão e discussão em terapia.', 'O resultado será integrado à análise clínica pelo psicólogo responsável.')
          s=re.sub(r'\s*<button\s+class=["\']btn btn-whatsapp["\']\s+id=["\']sendWhatsApp["\'][^>]*>.*?</button>\s*','\n',s,count=1,flags=re.S|re.I)
          s=re.sub(r'\s*<button\s+class=["\']btn btn-secondary["\']\s+id=["\']sharePageWhatsApp["\'][^>]*>.*?</button>\s*','\n',s,count=1,flags=re.S|re.I)
          s=re.sub(r"\s*const\s+sendWhatsAppBtn\s*=\s*document\.getElementById\(['\"]sendWhatsApp['\"]\);",'',s,count=1)
          s=re.sub(r"\s*const\s+sharePageWhatsAppBtn\s*=\s*document\.getElementById\(['\"]sharePageWhatsApp['\"]\);",'',s,count=1)
          s=re.sub(r'\s*function\s+buildWhatsAppMessage\s*\(\)\s*\{.*?(?=\s*if\s*\(sendWhatsAppBtn\))','\n',s,count=1,flags=re.S|re.I)
          s=re.sub(r'\s*if\s*\(sendWhatsAppBtn\)\s*\{.*?(?=\s*const\s+PDF_THEME\s*=)','\n',s,count=1,flags=re.S|re.I)
          s=re.sub(r'\s*(?:body\.theme-dark\s+)?\.btn-whatsapp(?::hover)?\s*\{[^}]*\}', '', s, flags=re.S|re.I)
          if s==before: raise SystemExit('NO_WHATSAPP_CHANGE')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Contract check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          if re.search(r'wa\.me|sendWhatsApp|sharePageWhatsApp|buildWhatsAppMessage|btn-whatsapp',s,re.I): raise SystemExit('WHATSAPP_RESIDUE')
          for marker in ['id="calculateResults"','const schemas =','const questions =','const PDF_THEME =','screening-uniformity-v1.js']:
              if marker not in s: raise SystemExit('QUESTIONNAIRE_STRUCTURE_CHANGED:'+marker)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove canais WhatsApp do rastreio'
          git push
