# activation: 1
name: Native Form Structure v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-form-structure-v1.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Convert clinical flow to explicit non-submitting form
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          script_marker='\n    <script>'
          if script_marker not in s:
              raise SystemExit('CLINICAL_SCRIPT_MARKER_MISSING')
          html, protected=s.split(script_marker,1)
          original_protected=protected

          if 'id="screeningForm"' not in html:
              start='\n        <section id="userdataSection" class="card hidden">'
              if start not in html:
                  raise SystemExit('USERDATA_MARKER_MISSING')
              html=html.replace(start,'\n        <form id="screeningForm" novalidate onsubmit="return false;">\n\n        <section id="userdataSection" class="card hidden">',1)

              end='\n        <footer>'
              if end not in html:
                  raise SystemExit('FOOTER_MARKER_MISSING')
              html=html.replace(end,'\n        </form>\n\n        <footer>',1)

          html=re.sub(r'<button(?![^>]*\btype\s*=)([^>]*)>',r'<button type="button"\1>',html,flags=re.I)

          out=html+script_marker+protected
          if out.split(script_marker,1)[1] != original_protected:
              raise SystemExit('QUESTIONNAIRE_RESULTS_OR_SCRIPT_CHANGED')
          if html.count('id="screeningForm"') != 1:
              raise SystemExit('SCREENING_FORM_COUNT_INVALID')
          if not re.search(r'<form\b[^>]*id="screeningForm"[^>]*onsubmit="return false;"',html,re.I):
              raise SystemExit('NON_SUBMITTING_FORM_MISSING')

          form_match=re.search(r'<form\b[^>]*id="screeningForm"[^>]*>(.*?)</form>',html,re.I|re.S)
          if not form_match:
              raise SystemExit('FORM_BOUNDARY_INVALID')
          form_body=form_match.group(1)
          for required in ['userdataSection','questionnaireSection','reviewSection','resultsSection','actionsSection']:
              if f'id="{required}"' not in form_body:
                  raise SystemExit(f'CLINICAL_SECTION_OUTSIDE_FORM_{required}')
          if 'id="consentSection"' in form_body or 'id="themeToggle"' in form_body:
              raise SystemExit('NON_CLINICAL_CONTROLS_INSIDE_FORM')

          buttons=re.findall(r'<button\b[^>]*>',html,re.I)
          if len(buttons) != 9:
              raise SystemExit(f'UNEXPECTED_STATIC_BUTTON_COUNT_{len(buttons)}')
          unsafe=[b for b in buttons if not re.search(r'\btype="button"',b,re.I)]
          if unsafe:
              raise SystemExit('BUTTON_WITHOUT_EXPLICIT_TYPE')

          p.write_text(out,encoding='utf-8')
          PY

      - name: Validate structure without enabling delivery
        shell: bash
        run: |
          grep -q 'id="screeningForm"' index.html
          grep -q 'onsubmit="return false;"' index.html
          grep -q 'type="button" class="btn btn-primary" id="goQuestionnaire"' index.html
          grep -q 'type="button" class="btn btn-primary" id="calculateResults"' index.html
          grep -q 'type="button" class="btn btn-secondary btn-download" id="downloadPdfReport"' index.html
          grep -q 'id="questionnaireSection"' index.html
          grep -q 'id="resultsSection"' index.html
          grep -q 'id="actionsSection"' index.html

      - name: Commit structural migration
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Converte Mapa de Esquemas para formulário estrutural sem submissão'
          git push
